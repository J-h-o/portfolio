<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--paper-0); font-family: var(--font-body); padding: 20px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  a { color: var(--text-accent); } a:hover { color: var(--green-700); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch } = window.AllushiDesignSystem_386bb0;

function Demo() {
  const [checked, setChecked] = React.useState(true);
  const [radio, setRadio] = React.useState('a');
  const [on, setOn] = React.useState(true);
  const [sel, setSel] = React.useState('web');
  return (
    <div>
      <div className="row">
        <Button variant="primary">Start a project</Button>
        <Button variant="accent">Get in touch</Button>
        <Button variant="secondary">See the work</Button>
        <Button variant="ghost">Ghost</Button>
        <Button variant="primary" disabled>Disabled</Button>
        <Button variant="primary" size="sm">Small</Button>
        <IconButton label="More" outline>···</IconButton>
      </div>
      <div className="cols">
        <Input label="Work email" placeholder="you@company.com" hint="We reply within one business day." />
        <Select label="Project type" value={sel} onChange={e => setSel(e.target.value)}
          options={[{ value: 'web', label: 'Web application' }, { value: 'ai', label: 'AI / automation' }, { value: 'plugin', label: 'Plugin / integration' }]} />
      </div>
      <div className="row" style={{ marginTop: 16 }}>
        <Checkbox label="Include an NDA" checked={checked} onChange={e => setChecked(e.target.checked)} />
        <Radio name="b" label="€10–25k" checked={radio === 'a'} onChange={() => setRadio('a')} />
        <Radio name="b" label="€25k+" checked={radio === 'b'} onChange={() => setRadio('b')} />
        <Switch label="Email updates" checked={on} onChange={e => setOn(e.target.checked)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
